; AFM project settings.
; Edit THIS file when the supervisor provides real values. Do not edit the code.
; Nothing here is a guess: unknown values are marked "unknown" and left out.

[project]
expected_image_count = 74

[run]
; preliminary = pixel units, not verified against raw data.
; "final" is only allowed when BOTH scale and time are confirmed.
label = preliminary

[scale]
; Image scale. ESTIMATED from the supervisor's email of 2026-11-02:
; "Each image is one micrometer." The JPG frame sizes vary (about 263 to 285 px),
; so the images may have been cropped or resized after the scan. The whole JPG
; frame is ASSUMED to be 1000 nm wide. Asked again, answer still pending.
; Switch to status = confirmed with nm_per_pixel = <value> once checked against raw data.
status = estimated
frame_size_nm = 1000
source = Dr. Abdelhady email 2026-11-02 (each image is one micrometer); whole JPG frame assumed

[time]
; Acquisition time. ESTIMATED range only, from the supervisor's email of 2026-11-02:
; 31 seconds per scan, imaging lasted one hour, some scans were corrupted and repeated,
; so 74 images were kept (fewer than 120). Exact scan times are unknown, and so is the
; moment the enzyme (DNase I) was added. Time is the START of each scan, counted from
; the start of the imaging hour.
; Each image gets an earliest and a latest possible time, not a single value.
status = estimated
frame_interval_s = 31
total_duration_s = 3600
source = Dr. Abdelhady email 2026-11-02 (31 s per image for one hour; some scans repeated)

; Other facts from the same email (not used by the code yet):
;   Z (height) range of the scans: 10 nm. The colour-to-height mapping is not known,
;   so AFM height is still NOT derived from JPG colour.
;   Enzyme: DNase I. Plasmid: pBR322, 4363 bp (about 1480 nm if fully stretched).
;   Bright spots on the DNA may be polymer and/or enzyme.
;   No fixed fragment size is expected: naked DNA is cut, polymer-covered DNA is
;   protected until the polymer is uncovered. No minimum fragment length (NA).

[segmentation]
; Region mask (Step 6). Works on JPG intensity, NOT on AFM height.
; Nothing is deleted for being small: every region is kept and labelled instead.
; Blur applied before thresholding, in pixels:
smoothing_sigma_px = 1.0
; "Strong" regions: this many noise-sigmas above the row/background level.
threshold_k = 6.0
; "Faint" regions: dimmer pieces that never reach the strong level but still
; stand out from the background (listed separately, tier = faint).
weak_threshold_k = 3.5
; Regions smaller than this are treated as pixel noise and not listed.
min_region_area_px = 10
; Size labels used for sorting and colours only (no region is dropped by them).
; In the 74 images region sizes split into thousands under ~160 px and few above
; ~320 px. What counts as a real fragment must be decided with Dr. Abdelhady.
small_area_px = 80
large_area_px = 320

[dna]
; Phase 2: DNA-level segmentation (JPG intensity, pixel units). All values are settings,
; not facts: Phase 4 repeats the analysis over ranges of them (sensitivity analysis).
low_k = 3.5
high_k = 6.0
bridge_radius_px = 2
min_dna_length_px = 40
min_loop_hole_px = 2000
min_hole_px = 150
edge_fraction = 0.4
bright_rel_level = 1.5

[tracking]
; Phase 3: linking objects between frames. Settings, not facts; Phase 4 varies them.
track_min_length_px = 20
link_dilate_px = 3
min_link_fraction = 0.30
gap_small_px = 8
persistence_frames = 3
min_fragment_length_px = 20
